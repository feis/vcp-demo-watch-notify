name: 追蹤社大公告

on:
  schedule:
    # 時間預設是世界標準時間（UTC），台灣時間 = UTC + 8 小時。
    # 「每小時第 17 分」兩邊一樣；若要「台灣每天早上 8 點」，UTC 是同一天 0 點：'0 0 * * *'，
    # 或在 cron 下一行加 timezone: "Asia/Taipei"，直接寫台灣時間 '0 8 * * *'。
    # 挑第 17 分而不是 0 分：整點最擠，容易延遲或被略過。
    - cron: '48 * * * *' # 此輪驗證用分鐘，驗完停用
  workflow_dispatch: # Actions 分頁上的「Run workflow」按鈕，手動跑一次

permissions:
  contents: write # 要把紀錄檔存回儲存庫

concurrency: watch # 同一時間只跑一個，避免兩次一起改紀錄檔

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - run: python 抓公告.py
        env:
          DISCORD_WEBHOOK: '' # 本次驗證只印出，不送訊息
          NEWS_URL: https://feis.github.io/vcp-demo-watch-notify/news/

      - name: 把已讀紀錄與抓取時間存回儲存庫
        if: ${{ always() }} # 失敗也要保存嘗試時間，避免下一次立刻再抓
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for file in 看過的公告.json 抓取時間.json; do
            if [ -f "$file" ]; then git add -- "$file"; fi
          done
          git diff --cached --quiet || { git commit -m "更新看過的公告"; git push; }
